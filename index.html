<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Modi Studio Dodge Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0217;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* Top HUD Bar */
        .hud-container {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-badge {
            background: rgba(18, 5, 36, 0.85);
            border: 2px solid #e6b800;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .hud-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffcc00;
            margin-bottom: 2px;
            font-weight: 700;
        }
        .hud-val {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }
        /* Idle Taunt Speech Bubble */
        #tauntBubble {
            position: absolute;
            display: none;
            background: #ffffff;
            color: #1a0033;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 18px;
            border: 3px solid #ff9933;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            animation: bounceBubble 1.5s infinite ease-in-out;
        }
        #tauntBubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 8px 0;
            border-style: solid;
            border-color: #ff9933 transparent;
            display: block;
            width: 0;
        }
        @keyframes bounceBubble {
            0%, 100% { margin-top: 0; }
            50% { margin-top: -6px; }
        }
        /* Bottom Instructions */
        .bottom-guide {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 204, 0, 0.4);
            color: #ffcc00;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 8px 20px;
            border-radius: 20px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }
        /* Level Victory Modal */
        #winModal {
            position: absolute;
            inset: 0;
            background: rgba(5, 0, 15, 0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .modal-box {
            background: linear-gradient(145deg, #1f083d, #3c095c);
            border: 3px solid #ffcc00;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.6);
            animation: popIn 0.4s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: #ffcc00;
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .modal-desc {
            color: #f1f1f1;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .next-btn {
            background: linear-gradient(90deg, #ff9933, #ff3300);
            border: none;
            outline: none;
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            padding: 14px 28px;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 51, 0, 0.6);
            transition: transform 0.15s ease;
        }
        .next-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="hud-badge">
            <div class="hud-title">Stage</div>
            <div class="hud-val" id="stageTxt">1</div>
        </div>
        <div class="hud-badge">
            <div class="hud-title">Shots</div>
            <div class="hud-val" id="shotsTxt">0</div>
        </div>
        <div class="hud-badge">
            <div class="hud-title">Dodged</div>
            <div class="hud-val" id="dodgedTxt">0</div>
        </div>
        <div class="hud-badge">
            <div class="hud-title">Target</div>
            <div class="hud-val" id="targetTxt">50</div>
        </div>
    </div>

    <div id="tauntBubble">Mitron, nishana theek karo!</div>
    <div class="bottom-guide">Tap Anywhere to Shoot</div>

    <div id="winModal">
        <div class="modal-box">
            <div class="modal-title">NISHANA LAG GAYA!</div>
            <p class="modal-desc">Aapne target shot par character ko gira diya hai. Agla stage aur mushkil hoga!</p>
            <button class="next-btn" id="nextLevelBtn">Agla Level Shuru Karein</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const stageTxt = document.getElementById('stageTxt');
        const shotsTxt = document.getElementById('shotsTxt');
        const dodgedTxt = document.getElementById('dodgedTxt');
        const targetTxt = document.getElementById('targetTxt');
        const tauntBubble = document.getElementById('tauntBubble');
        const winModal = document.getElementById('winModal');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context for Realistic Gunfire
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playGunSound() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.13);
        }

        // Taunts Setup
        const hindiTaunts = [
            "Mitron, goli khatam ho gayi kya?",
            "56 inch ka seena hai, nishana theek karo!",
            "Aise toh kal subah tak nahi lagegi!",
            "Bhaag gaya na main? Aur tej shoot karo!",
            "Dhyan kahan hai aapka? Nishana chook gaya!"
        ];
        let lastActionTime = Date.now();
        let isTaunting = false;

        function triggerTaunt() {
            if (isHit || isTaunting) return;
            isTaunting = true;
            const text = hindiTaunts[Math.floor(Math.random() * hindiTaunts.length)];
            tauntBubble.innerText = text;
            tauntBubble.style.display = 'block';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'hi-IN';
                utter.rate = 1.05;
                window.speechSynthesis.speak(utter);
            }
        }

        function cancelTaunt() {
            lastActionTime = Date.now();
            if (isTaunting) {
                isTaunting = false;
                tauntBubble.style.display = 'none';
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        // Game State Variables
        let currentStage = 1;
        let shotsCount = 0;
        let dodgedCount = 0;
        let targetKnockout = Math.floor(Math.random() * 45) + 3; // Random shot between 3 and 50
        let isHit = false;

        // Realistic Avatar Image (High-Resolution 3D Modi Cartoon with transparent background)
        const charImg = new Image();
        charImg.crossOrigin = 'anonymous';
        charImg.src = 'https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTAxL3Jhd3BpeGVsX29mZmljZV8zOV9jdXRlX2NhcnRvb25fbW9kaV9jaGFyYWN0ZXJfc3R5bGVfZmxhdF9kZXNpZ25faV8wOGUxYTVjOC1mMjNlLTQ3MTgtODdmMy1hMWY4OWJmNDkxY2ZfcG5nLnBuZw.png';

        // Real-feeling Physics Character Object
        const character = {
            x: window.innerWidth * 0.5,
            targetX: window.innerWidth * 0.5,
            y: window.innerHeight * 0.58,
            width: 140,
            height: 220,
            tilt: 0,
            targetTilt: 0,
            jumpY: 0,
            shadowScale: 1,
            dustParticles: [],
            ghostTrails: []
        };

        // Bullets & Particles Arrays
        const bullets = [];
        const stageLights = [
            { x: 0.15, beamX: 0.25, color: 'rgba(255, 215, 0, 0.12)' },
            { x: 0.5, beamX: 0.5, color: 'rgba(255, 120, 200, 0.10)' },
            { x: 0.85, beamX: 0.75, color: 'rgba(255, 215, 0, 0.12)' }
        ];

        // Shoot action
        function shootGun(tapX, tapY) {
            if (isHit) return;
            cancelTaunt();
            playGunSound();

            shotsCount++;
            shotsTxt.innerText = shotsCount;

            const willKnockout = (shotsCount === targetKnockout);

            const bullet = {
                x: W * 0.5,
                y: H - 30,
                speedY: H * 0.045, // Super fast bullet
                targetX: willKnockout ? character.x : (tapX || character.x),
                isFatal: willKnockout
            };
            bullets.push(bullet);

            // Instant Reactive Dodge If not fatal
            if (!willKnockout) {
                const stageMin = W * 0.18;
                const stageMax = W * 0.82;
                let newX;
                // Dash away sharply from the bullet
                if (character.x < W * 0.5) {
                    newX = Math.random() * (stageMax - W * 0.55) + W * 0.55;
                } else {
                    newX = Math.random() * (W * 0.45 - stageMin) + stageMin;
                }
                
                character.targetX = newX;
                character.targetTilt = (newX > character.x ? 0.35 : -0.35); // Leaning body physics
                character.jumpY = -35; // Leap dodge reflex

                // Spawn Ground Dust on Quick Foot Jump
                for (let i = 0; i < 8; i++) {
                    character.dustParticles.push({
                        x: character.x + (Math.random() * 40 - 20),
                        y: character.y + character.height * 0.48,
                        vx: (Math.random() - 0.5) * 5,
                        vy: -Math.random() * 3,
                        alpha: 1,
                        size: Math.random() * 6 + 3
                    });
                }
            }
        }

        // Tap listener
        window.addEventListener('pointerdown', (e) => {
            shootGun(e.clientX, e.clientY);
        });

        // Next Level Button (Adsterra Redirect)
        nextLevelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.open('https://asiafilm.org/4/76bcbe6093183fc9886a1460684a0608', '_blank');
            winModal.style.display = 'none';

            // Setup Next Stage
            currentStage++;
            stageTxt.innerText = currentStage;
            shotsCount = 0;
            dodgedCount = 0;
            shotsTxt.innerText = 0;
            dodgedTxt.innerText = 0;

            const minTarget = 50 * (currentStage - 1);
            const maxTarget = 50 * currentStage + 20;
            targetKnockout = Math.floor(Math.random() * (maxTarget - minTarget)) + minTarget;
            targetTxt.innerText = targetKnockout;

            isHit = false;
            character.jumpY = 0;
            character.tilt = 0;
            character.x = W * 0.5;
            character.targetX = W * 0.5;
            cancelTaunt();
        });

        // Render Functions
        function drawStageBackdrop() {
            // Royal Purple Gradient Wall
            const grad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
            grad.addColorStop(0, '#100126');
            grad.addColorStop(0.5, '#28054a');
            grad.addColorStop(1, '#470868');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H * 0.65);

            // Pillar Columns
            ctx.fillStyle = 'rgba(25, 3, 45, 0.65)';
            ctx.fillRect(0, 0, W * 0.12, H * 0.65);
            ctx.fillRect(W * 0.88, 0, W * 0.12, H * 0.65);

            // Spotlights
            stageLights.forEach(light => {
                ctx.save();
                const beam = ctx.createLinearGradient(W * light.x, 0, W * light.beamX, H * 0.65);
                beam.addColorStop(0, 'rgba(255, 235, 150, 0.35)');
                beam.addColorStop(1, light.color);
                ctx.fillStyle = beam;
                ctx.beginPath();
                ctx.moveTo(W * light.x, 0);
                ctx.lineTo(W * light.beamX - 120, H * 0.65);
                ctx.lineTo(W * light.beamX + 120, H * 0.65);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Stage Floor (Saffron-red Perspective Tiles)
            const floorGrad = ctx.createLinearGradient(0, H * 0.65, 0, H);
            floorGrad.addColorStop(0, '#5a0c00');
            floorGrad.addColorStop(0.3, '#8e1a04');
            floorGrad.addColorStop(1, '#d83808');
            ctx.fillStyle = floorGrad;
            ctx.fillRect(0, H * 0.65, W, H * 0.35);

            // Floor Perspective Grid Lines
            ctx.strokeStyle = 'rgba(255, 175, 40, 0.22)';
            ctx.lineWidth = 1.5;
            const totalLines = 14;
            for (let i = 0; i <= totalLines; i++) {
                ctx.beginPath();
                ctx.moveTo(W * 0.5, H * 0.65);
                const xBottom = (W / totalLines) * i * 2 - (W * 0.5);
                ctx.lineTo(xBottom, H);
                ctx.stroke();
            }
            // Horizontal rings
            for (let j = 1; j <= 5; j++) {
                const y = H * 0.65 + (H * 0.35) * Math.pow(j / 5, 1.6);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
        }

        function updateAndDrawCharacter() {
            // Smooth snappy evasion motion
            const prevX = character.x;
            character.x += (character.targetX - character.x) * 0.36; // Fast spring dodge
            character.tilt += (character.targetTilt - character.tilt) * 0.25;
            character.targetTilt *= 0.85; // Natural recovery

            // Jump gravity return
            if (character.jumpY < 0) {
                character.jumpY += 3.2;
                if (character.jumpY > 0) character.jumpY = 0;
            }

            // High-Speed Ghost Blur Trails during quick dodge
            if (Math.abs(character.x - prevX) > 4) {
                character.ghostTrails.push({
                    x: character.x,
                    y: character.y + character.jumpY,
                    tilt: character.tilt,
                    alpha: 0.45
                });
            }

            // Render Ghost Blur
            character.ghostTrails.forEach((trail, idx) => {
                ctx.save();
                ctx.globalAlpha = trail.alpha;
                ctx.translate(trail.x, trail.y);
                ctx.rotate(trail.tilt);
                if (charImg.complete && charImg.naturalWidth !== 0) {
                    ctx.drawImage(charImg, -character.width / 2, -character.height / 2, character.width, character.height);
                }
                ctx.restore();
                trail.alpha -= 0.08;
                if (trail.alpha <= 0) character.ghostTrails.splice(idx, 1);
            });

            // 1. REALISTIC DROP SHADOW (NO MORE REVERSE MIRROR DUPLICATE)
            const groundY = character.y + character.height * 0.46;
            ctx.save();
            const shadowWidth = (character.width * 0.65) * (1 - Math.abs(character.jumpY) * 0.008);
            const shadowHeight = 16 * (1 - Math.abs(character.jumpY) * 0.008);
            const shadowAlpha = Math.max(0.2, 0.65 - Math.abs(character.jumpY) * 0.012);

            const shadowGrad = ctx.createRadialGradient(
                character.x, groundY, 2,
                character.x, groundY, shadowWidth
            );
            shadowGrad.addColorStop(0, `rgba(15, 0, 5, ${shadowAlpha})`);
            shadowGrad.addColorStop(0.6, `rgba(25, 2, 8, ${shadowAlpha * 0.6})`);
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(character.x, groundY, shadowWidth, shadowHeight, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2. DUST PARTICLES ON GROUND
            character.dustParticles.forEach((p, index) => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 204, 100, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) character.dustParticles.splice(index, 1);
            });

            // 3. DRAW MAIN REALISTIC CHARACTER
            ctx.save();
            ctx.translate(character.x, character.y + character.jumpY);
            ctx.rotate(character.tilt);

            if (charImg.complete && charImg.naturalWidth !== 0) {
                // Natural breathing scale & running stretch
                const stretch = Math.abs(character.x - prevX) * 0.002;
                ctx.drawImage(
                    charImg,
                    (-character.width / 2) - (character.width * stretch) / 2,
                    (-character.height / 2),
                    character.width * (1 + stretch),
                    character.height
                );
            } else {
                // Fallback while loading
                ctx.fillStyle = '#ff9933';
                ctx.fillRect(-character.width / 2, -character.height / 2, character.width, character.height);
            }
            ctx.restore();

            // Update Speech Bubble coordinates above head
            tauntBubble.style.left = character.x + 'px';
            tauntBubble.style.top = (character.y + character.jumpY - character.height * 0.55) + 'px';
        }

        function updateAndDrawBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= b.speedY;

                // Glowing bullet trace
                ctx.save();
                ctx.fillStyle = '#ffee44';
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();

                // Bullet Tail
                ctx.strokeStyle = 'rgba(255, 120, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x, b.y + 25);
                ctx.stroke();
                ctx.restore();

                // Hit Detection
                const targetAreaY = character.y + character.jumpY;
                if (Math.abs(b.y - targetAreaY) < 35) {
                    if (b.isFatal) {
                        // Knockout connection
                        isHit = true;
                        character.targetTilt = 1.4; // Fall down
                        character.jumpY = 25;
                        bullets.splice(i, 1);
                        cancelTaunt();
                        setTimeout(() => {
                            winModal.style.display = 'flex';
                        }, 700);
                        return;
                    } else {
                        // Successfully Dodged
                        dodgedCount++;
                        dodgedTxt.innerText = dodgedCount;
                        bullets.splice(i, 1);
                    }
                } else if (b.y < -30) {
                    bullets.splice(i, 1);
                }
            }
        }

        // Main Loop
        function gameLoop() {
            ctx.clearRect(0, 0, W, H);

            // Draw Stage
            drawStageBackdrop();

            // Idle Taunt Check (3 seconds of no shooting)
            if (Date.now() - lastActionTime > 3000 && !isHit) {
                triggerTaunt();
            }

            // Draw Character & Bullets
            updateAndDrawCharacter();
            updateAndDrawBullets();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

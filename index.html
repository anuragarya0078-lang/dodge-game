<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bullet Dodge Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: 'Arial Black', Impact, sans-serif;
      touch-action: manipulation;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #cfc2a7;
    }

    /* TOP PLASTER WALL */
    #top-wall {
      flex: 1.1;
      background: #e5dac2;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #2b1305;
    }

    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .level-badge {
      background: #3b281c;
      color: #fff;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .level-badge span {
      background: #f39c12;
      color: #000;
      padding: 2px 7px;
      border-radius: 8px;
      font-size: 11px;
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #4a69bd;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .test-btn {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* HANGING WOODEN SIGN */
    #sign-rig {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .ropes {
      display: flex;
      width: 140px;
      justify-content: space-between;
      height: 25px;
    }

    .rope {
      width: 5px;
      height: 100%;
      background: repeating-linear-gradient(to bottom, #5a3d1c, #5a3d1c 4px, #8d6232 4px, #8d6232 8px);
    }

    #wooden-board {
      background: linear-gradient(180deg, #7a3e18 0%, #52270b 100%);
      border: 4px solid #2b1305;
      border-radius: 10px;
      padding: 8px 25px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    #miss-count {
      font-size: 38px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
    }

    #miss-label {
      font-size: 26px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
    }

    /* MIDDLE BRICK WALL */
    #brick-wall {
      flex: 1.5;
      background-color: #a8321c;
      background-image: 
        linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
        linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px),
        linear-gradient(335deg, rgba(0,0,0,0.3) 23px, transparent 23px),
        linear-gradient(155deg, rgba(0,0,0,0.3) 23px, transparent 23px);
      background-size: 58px 58px;
      background-position: 0px 2px, 4px 35px, 29px 31px, 34px 4px;
      position: relative;
      border-top: 5px solid #2b1305;
      border-bottom: 5px solid #2b1305;
    }

    /* BOTTOM FLOOR */
    #bottom-floor {
      flex: 1.0;
      background: #bfa15f;
      position: relative;
    }

    .footer-badge {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: #d4b572;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #3b281c;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* BULLET HOLE & TAGS */
    .bullet-hole {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #050505 50%, #292929 70%, #575757 100%);
      box-shadow: 0 0 5px rgba(0,0,0,0.9);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }

    .miss-tag {
      position: absolute;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 6;
      transform: translate(-50%, -50%);
    }

    /* CHARACTER ROOT */
    #char-wrapper {
      position: absolute;
      bottom: -35px;
      left: 50%;
      width: 130px;
      height: 240px;
      transform: translateX(-50%);
      z-index: 15;
      cursor: pointer;
      transform-origin: bottom center;
      transition: left 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    #character-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* CONTINUOUS DANCE ANIMATION */
    .continuous-dance {
      animation: grooveDance 0.55s infinite alternate ease-in-out !important;
    }

    @keyframes grooveDance {
      0% { transform: translateX(-50%) rotate(-10deg) scale(0.96, 1.04); }
      50% { transform: translateX(-50%) translateY(-10px) rotate(0deg) scale(1.04, 0.96); }
      100% { transform: translateX(-50%) rotate(10deg) scale(0.96, 1.04); }
    }

    .eliminated {
      animation: fallDown 0.8s forwards cubic-bezier(0.55, 0.055, 0.675, 0.19) !important;
    }

    @keyframes fallDown {
      0% { transform: translateX(-50%) rotate(0deg); }
      40% { transform: translateX(-50%) rotate(-45deg) translateY(-20px); }
      100% { transform: translateX(-50%) rotate(-90deg) translateY(120px); opacity: 0.2; }
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      border: 4px solid #f39c12;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #27ae60;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="app-container">

  <!-- SIGN UP MODAL -->
  <div id="signup-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="font-size:24px; margin-bottom:10px;">READY TO SHOOT?</h2>
      <p style="font-size:14px; margin-bottom:15px; font-family:sans-serif;">Enter your name & hit the cartoon!</p>
      <input type="text" id="player-name" placeholder="Player Name" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:2px solid #ccc; font-size:16px; text-align:center;">
      <button class="btn-main" onclick="startGame()">START GAME 🎯</button>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="win-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2 style="color:#d63031; font-size:24px; margin-bottom:10px;">K.O.! ELIMINATED! 💥</h2>
      <p id="win-subtext" style="font-size:14px; margin-bottom:15px; font-family:sans-serif;">Target cleared!</p>
      <!-- Direct Ad Link Trigger on Next Level -->
      <button class="btn-main" onclick="triggerNextLevelWithAd()">NEXT LEVEL ⏩</button>
    </div>
  </div>

  <!-- TOP BAR -->
  <div id="top-bar">
    <div class="level-badge">
      🤠 Sheriff <span id="level-indicator">LVL 1</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn">🔊</button>
      <button class="test-btn" onclick="testFastAdd()">+100 ⚡</button>
    </div>
  </div>

  <!-- TOP PLASTER WALL -->
  <div id="top-wall">
    <div id="sign-rig">
      <div class="ropes">
        <div class="rope"></div>
        <div class="rope"></div>
      </div>
      <div id="wooden-board">
        <span id="miss-count">0</span>
        <span id="miss-label">MISS</span>
      </div>
    </div>
  </div>

  <!-- MIDDLE BRICK WALL -->
  <div id="brick-wall">
    <div id="char-wrapper" onclick="handleTapShoot(event)">
      
      <svg id="character-svg" viewBox="0 0 160 260">
        <ellipse cx="80" cy="245" rx="42" ry="7" fill="rgba(0,0,0,0.35)"/>

        <g id="bodyRig">
          <!-- LEGS & PINK SHOES -->
          <g id="legLeftGroup">
            <path id="legLeftPath" d="M 68 155 Q 65 195 62 235" stroke="#111" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 38 235 Q 38 220 58 220 Q 78 220 78 235 Q 78 245 58 245 Z" fill="#d86b77" stroke="#111" stroke-width="4"/>
          </g>

          <g id="legRightGroup">
            <path id="legRightPath" d="M 88 155 Q 92 195 98 235" stroke="#111" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M 78 235 Q 78 220 98 220 Q 118 220 118 235 Q 118 245 98 245 Z" fill="#d86b77" stroke="#111" stroke-width="4"/>
          </g>

          <!-- PINK TORSO -->
          <g id="torsoGroup">
            <path d="M 72 108 Q 98 108 94 135 Q 90 162 76 162 Q 62 162 65 135 Q 68 108 72 108 Z" fill="#d86b77" stroke="#111" stroke-width="5"/>
          </g>

          <!-- ARMS -->
          <g id="backArmGroup">
            <path id="backArmPath" d="M 68 118 Q 50 145 58 175" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <circle id="backHand" cx="58" cy="177" r="5" fill="#111"/>
          </g>

          <g id="frontArmGroup">
            <path id="frontArmPath" d="M 90 120 Q 108 148 98 178" stroke="#111" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <circle id="frontHand" cx="98" cy="180" r="5" fill="#111"/>
          </g>

          <!-- HEAD -->
          <g id="headGroup">
            <path d="M 52 82 C 40 45, 68 15, 102 18 C 132 20, 142 55, 126 85 C 122 92, 124 100, 126 108 C 112 118, 92 118, 78 112 C 60 112, 54 95, 52 82 Z" fill="#dfbe9f" stroke="#111" stroke-width="4.5" stroke-linejoin="round"/>
            <path d="M 124 88 C 132 86, 135 96, 128 100" fill="#dfbe9f" stroke="#111" stroke-width="3"/>
            <path d="M 58 48 Q 72 45 80 50" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M 88 47 Q 102 44 114 49" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>
            <ellipse cx="72" cy="62" rx="13" ry="15" fill="#fff" stroke="#111" stroke-width="3.5"/>
            <circle cx="74" cy="64" r="5.5" fill="#111"/>
            <ellipse cx="98" cy="63" rx="13" ry="15" fill="#fff" stroke="#111" stroke-width="3.5"/>
            <circle cx="96" cy="65" r="5.5" fill="#111"/>
            <path d="M 76 72 C 72 85, 94 90, 94 77 C 94 72, 85 68, 76 72 Z" fill="#dfbe9f" stroke="#111" stroke-width="3.5"/>
            <g id="mouthGroup">
              <path id="mouthOutline" d="M 68 90 Q 90 108 112 90 Q 92 115 68 90 Z" fill="#6a1414" stroke="#111" stroke-width="3"/>
              <path d="M 76 92 L 80 97 L 85 92" stroke="#fff" stroke-width="3" fill="#fff"/>
              <path d="M 98 92 L 102 96 L 106 91" stroke="#fff" stroke-width="3" fill="#fff"/>
              <path d="M 82 100 Q 92 95 98 102 Q 90 110 82 100 Z" fill="#ff5e7e"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- BOTTOM FLOOR -->
  <div id="bottom-floor">
    <div class="footer-badge" id="footer-badge-text">LVL 1 • 50+ SHOTS</div>
  </div>

</div>

<script>
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playGunshotSound() {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.02));
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      noise.connect(ctx.destination);
      noise.start(now);
    } catch(e) {}
  }

  let missCount = 0;
  let currentLevel = 1;
  let isEliminated = false;
  let targetCount = 50; // Level 1 target
  const dodgePositions = [18, 34, 50, 66, 82];
  let currentPosIndex = 2;

  let idleTimer = null;
  let isDancing = false;

  const charWrapper = document.getElementById('char-wrapper');
  const missCountElem = document.getElementById('miss-count');
  const brickWall = document.getElementById('brick-wall');
  const levelIndicator = document.getElementById('level-indicator');
  const footerBadgeText = document.getElementById('footer-badge-text');
  const winModal = document.getElementById('win-modal');

  const frontArmPath = document.getElementById('frontArmPath');
  const backArmPath = document.getElementById('backArmPath');
  const frontHand = document.getElementById('frontHand');
  const backHand = document.getElementById('backHand');

  function startGame() {
    document.getElementById('signup-modal').style.display = 'none';
    getAudio();
    scheduleIdleDance(1000);
  }

  function scheduleIdleDance(delay = 1200) {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      startContinuousDance();
    }, delay);
  }

  function startContinuousDance() {
    if (isEliminated) return;
    isDancing = true;

    frontArmPath.setAttribute('d', 'M 90 120 Q 130 90 125 55');
    frontHand.setAttribute('cx', '125');
    frontHand.setAttribute('cy', '53');

    backArmPath.setAttribute('d', 'M 68 118 Q 30 90 35 55');
    backHand.setAttribute('cx', '35');
    backHand.setAttribute('cy', '53');

    charWrapper.classList.add('continuous-dance');
  }

  function stopContinuousDance() {
    isDancing = false;
    charWrapper.classList.remove('continuous-dance');

    frontArmPath.setAttribute('d', 'M 90 120 Q 108 148 98 178');
    frontHand.setAttribute('cx', '98');
    frontHand.setAttribute('cy', '180');

    backArmPath.setAttribute('d', 'M 68 118 Q 50 145 58 175');
    backHand.setAttribute('cx', '58');
    backHand.setAttribute('cy', '177');
  }

  function handleTapShoot(e) {
    if (isEliminated) return;
    if (e) e.stopPropagation();

    stopContinuousDance();
    playGunshotSound();
    spawnBulletHole(e);

    missCount++;
    missCountElem.textContent = missCount;

    // Elimination check (50+ shots)
    if (missCount >= targetCount && Math.random() > 0.4) {
      eliminateCharacter();
      return;
    }

    // Dodge left/right
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * dodgePositions.length);
    } while (nextIndex === currentPosIndex);
    currentPosIndex = nextIndex;
    charWrapper.style.left = dodgePositions[currentPosIndex] + '%';

    scheduleIdleDance(1000);
  }

  function spawnBulletHole(e) {
    const wallRect = brickWall.getBoundingClientRect();
    const x = e && e.clientX ? e.clientX - wallRect.left : (dodgePositions[currentPosIndex] / 100) * wallRect.width;
    const y = e && e.clientY ? e.clientY - wallRect.top : wallRect.height * 0.45;

    const hole = document.createElement('div');
    hole.className = 'bullet-hole';
    hole.style.left = x + 'px';
    hole.style.top = y + 'px';
    brickWall.appendChild(hole);

    const tag = document.createElement('div');
    tag.className = 'miss-tag';
    tag.textContent = 'MISS';
    tag.style.left = x + 'px';
    tag.style.top = (y - 20) + 'px';
    brickWall.appendChild(tag);

    if (brickWall.childElementCount > 40) brickWall.removeChild(brickWall.children[2]);
  }

  function eliminateCharacter() {
    isEliminated = true;
    clearTimeout(idleTimer);
    stopContinuousDance();

    charWrapper.classList.add('eliminated');

    setTimeout(() => {
      document.getElementById('win-subtext').textContent = `Target cleared with ${missCount} shots!`;
      winModal.style.display = 'flex';
    }, 850);
  }

  // AD INTEGRATION HOOK
  function triggerNextLevelWithAd() {
    // Yahan apna Adsterra ya Monetag ka direct ad link daal sakte hain
    // window.open("https://your-ad-direct-link.com", "_blank");

    winModal.style.display = 'none';
    startNextLevel();
  }

  function startNextLevel() {
    currentLevel++;
    targetCount = currentLevel * 50;
    levelIndicator.textContent = `LVL ${currentLevel}`;
    footerBadgeText.textContent = `LVL ${currentLevel} • ${targetCount}+ SHOTS`;

    const holes = brickWall.querySelectorAll('.bullet-hole, .miss-tag');
    holes.forEach(el => el.remove());

    isEliminated = false;
    currentPosIndex = 2;
    charWrapper.style.left = '50%';
    charWrapper.classList.remove('eliminated');
    stopContinuousDance();
    scheduleIdleDance(1000);
  }

  function testFastAdd() {
    if (isEliminated) return;
    for (let i = 0; i < 99; i++) missCount++;
    handleTapShoot(null);
  }
</script>

</body>
</html>

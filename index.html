<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dodge Runner - Bullet Dodge Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11141a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .badge {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #hint {
      position: absolute;
      bottom: 24px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      pointer-events: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    /* Win Modal */
    #winModal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 20;
    }
    #winModal h1 {
      font-size: 32px;
      color: #ffd700;
      margin-bottom: 8px;
    }
    #winModal p {
      font-size: 16px;
      margin-bottom: 24px;
      color: #ddd;
    }
    #nextLevelBtn {
      background: linear-gradient(135deg, #00c853, #64dd17);
      color: #000;
      font-weight: 800;
      font-size: 18px;
      padding: 14px 32px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(100,221,23,0.4);
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="badge">LEVEL: <span id="lvlDisplay">1</span></div>
    <div class="badge">SHOTS: <span id="shotsDisplay">0</span> / 50</div>
    <div class="badge">DODGED: <span id="dodgeDisplay">0</span></div>
  </div>

  <div id="hint">TAP CHARACTER TO SHOOT & WATCH HIM RUN & DODGE!</div>

  <canvas id="gameCanvas"></canvas>

  <div id="winModal">
    <h1>LEVEL COMPLETED!</h1>
    <p>50 Bullets Dodged Like a Pro!</p>
    <button id="nextLevelBtn" onclick="triggerNextLevelWithAd()">NEXT LEVEL ⏩</button>
  </div>

  <script>
    // ADSTERRA DIRECT LINK INTEGRATION
    const AD_DIRECT_LINK = "https://asiafilm.org/4/76bcbe6093183fc9886a1460684a0608";

    function triggerNextLevelWithAd() {
      if (AD_DIRECT_LINK) {
        window.open(AD_DIRECT_LINK, "_blank");
      }
      document.getElementById('winModal').style.display = 'none';
      startNextLevel();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let level = 1;
    let shotsFired = 0;
    let dodgedCount = 0;
    const maxShots = 50;

    // Character model
    const runner = {
      x: width / 2,
      y: height * 0.65,
      targetX: width / 2,
      size: 38,
      speed: 18,
      isDodging: false,
      direction: 1, // 1 = right, -1 = left
      legAngle: 0,
      runningTimer: 0
    };

    // Bullets & Particles
    let bullets = [];
    let particles = [];

    // Gun audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playGunSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    // Runner instant reflex dodge action
    function makeRunnerDodge() {
      playGunSound();
      runner.isDodging = true;
      runner.runningTimer = 35; // Running leg animation steps

      // Goli chhootne se theek pehle side me bhaagna
      const dodgeDistance = Math.min(width * 0.35, 140);
      if (runner.x > width * 0.65) {
        runner.direction = -1;
      } else if (runner.x < width * 0.35) {
        runner.direction = 1;
      } else {
        runner.direction = Math.random() > 0.5 ? 1 : -1;
      }

      const prevX = runner.x;
      runner.targetX = runner.x + (runner.direction * dodgeDistance);

      // Boundaries me rakhna
      if (runner.targetX < 50) runner.targetX = 60;
      if (runner.targetX > width - 50) runner.targetX = width - 60;

      // Spawn bullet targetting where the character WAS (Bullet will miss)
      bullets.push({
        x: width / 2,
        y: height - 40,
        targetX: prevX + (Math.random() * 20 - 10),
        targetY: runner.y,
        progress: 0,
        speed: 0.05
      });

      // Ground dust particles
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: runner.x,
          y: runner.y + 40,
          vx: (Math.random() - 0.5) * 4,
          vy: -Math.random() * 2,
          alpha: 0.8,
          radius: Math.random() * 4 + 2
        });
      }

      shotsFired++;
      dodgedCount++;
      updateUI();

      if (shotsFired >= maxShots) {
        setTimeout(() => {
          document.getElementById('winModal').style.display = 'flex';
        }, 500);
      }
    }

    function updateUI() {
      document.getElementById('lvlDisplay').innerText = level;
      document.getElementById('shotsDisplay').innerText = shotsFired;
      document.getElementById('dodgeDisplay').innerText = dodgedCount;
    }

    function startNextLevel() {
      level++;
      shotsFired = 0;
      runner.speed += 1.5;
      updateUI();
    }

    // Tap handling
    window.addEventListener('pointerdown', (e) => {
      if (shotsFired >= maxShots) return;
      makeRunnerDodge();
    });

    // Drawing Runner with dynamic moving legs
    function drawRunner() {
      const dx = runner.targetX - runner.x;
      if (Math.abs(dx) > 1) {
        runner.x += dx * 0.24;
      } else {
        runner.x = runner.targetX;
      }

      // Running animation
      if (runner.runningTimer > 0) {
        runner.runningTimer--;
        runner.legAngle += 0.5; // Fast leg pedaling
      } else {
        runner.legAngle = Math.sin(Date.now() * 0.005) * 0.1;
      }

      ctx.save();
      ctx.translate(runner.x, runner.y);

      // Body lean/tilt while running
      const tilt = runner.runningTimer > 0 ? runner.direction * 0.22 : 0;
      ctx.rotate(tilt);

      // Shadow on floor
      ctx.beginPath();
      ctx.ellipse(0, 42, 22, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fill();

      // LEFT LEG
      ctx.save();
      ctx.translate(-8, 18);
      ctx.rotate(Math.sin(runner.legAngle) * 0.85);
      ctx.strokeStyle = "#388e3c";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 20);
      ctx.stroke();
      // Foot
      ctx.fillStyle = "#ffb300";
      ctx.fillRect(-2, 18, 8, 4);
      ctx.restore();

      // RIGHT LEG (Opposite phase)
      ctx.save();
      ctx.translate(8, 18);
      ctx.rotate(-Math.sin(runner.legAngle) * 0.85);
      ctx.strokeStyle = "#2e7d32";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 20);
      ctx.stroke();
      // Foot
      ctx.fillStyle = "#ffb300";
      ctx.fillRect(-2, 18, 8, 4);
      ctx.restore();

      // BODY (Torso)
      ctx.fillStyle = "#4caf50";
      ctx.beginPath();
      ctx.roundRect(-14, -10, 28, 30, 8);
      ctx.fill();

      // HEAD
      ctx.fillStyle = "#ffcc80";
      ctx.beginPath();
      ctx.arc(0, -22, 14, 0, Math.PI * 2);
      ctx.fill();

      // HEADBAND
      ctx.fillStyle = "#e53935";
      ctx.fillRect(-14, -28, 28, 6);

      // EYES (Focused in running direction)
      ctx.fillStyle = "#000";
      const eyeOffset = runner.direction * 3.5;
      ctx.beginPath();
      ctx.arc(-4 + eyeOffset, -22, 2.5, 0, Math.PI * 2);
      ctx.arc(4 + eyeOffset, -22, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // ARMS (Swinging realistically)
      ctx.strokeStyle = "#ffcc80";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      // Left arm
      ctx.beginPath();
      ctx.moveTo(-14, -4);
      ctx.lineTo(-20 + Math.sin(runner.legAngle) * 12, 8);
      ctx.stroke();
      // Right arm
      ctx.beginPath();
      ctx.moveTo(14, -4);
      ctx.lineTo(20 - Math.sin(runner.legAngle) * 12, 8);
      ctx.stroke();

      ctx.restore();
    }

    // Game loop
    function loop() {
      ctx.clearRect(0, 0, width, height);

      // Floor grid lines
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      for (let y = height * 0.55; y < height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Draw dust
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw character
      drawRunner();

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.progress += b.speed;

        const curX = b.x + (b.targetX - b.x) * b.progress;
        const curY = b.y + (b.targetY - b.y) * b.progress;

        // Bullet glow
        ctx.fillStyle = "#ffee55";
        ctx.shadowColor = "#ff9800";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(curX, curY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Tracer trail
        ctx.strokeStyle = "rgba(255, 170, 0, 0.5)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(curX, curY);
        ctx.lineTo(curX, curY + 25);
        ctx.stroke();

        if (b.progress >= 1.2) {
          bullets.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
